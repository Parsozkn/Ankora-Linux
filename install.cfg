submenu 'Grafiksel Ankora Kurulumu ...' --hotkey=g {

	set menu_color_normal=white/black
	set menu_color_highlight=black/light-gray
	background_image /boot/grub/ankoraboot.png

	menuentry 'Ankora OS Kur' --hotkey=i {
		linux	/live/vmlinuz boot=live vga=788  --- quiet
		initrd	/live/initrd.xz
	}

	menuentry 'Uzman Kurulumu' --hotkey=x {
		linux	/live/vmlinuz boot=live priority=low vga=788
		initrd	/live/initrd.xz
	}

	menuentry 'Otomatik Kurulum' --hotkey=a {
		linux	/live/vmlinuz boot=live auto=true priority=critical vga=788  --- quiet
		initrd	/live/initrd.xz
	}

	menuentry 'Kurtarma Modu (Rescue)' --hotkey=r {
		linux	/live/vmlinuz boot=live rescue/enable=true vga=788  --- quiet
		initrd	/live/initrd.xz
	}
}

submenu 'Metin Tabanli Ankora Kurulumu ...' --hotkey=t {

	set menu_color_normal=white/black
	set menu_color_highlight=black/light-gray
	background_image /boot/grub/ankoraboot.png

	menuentry 'Ankora OS Kur' --hotkey=i {
		linux	/live/vmlinuz boot=live vga=788  --- quiet
		initrd	/live/initrd.xz
	}

	menuentry 'Uzman Kurulumu' --hotkey=x {
		linux	/live/vmlinuz boot=live priority=low vga=788
		initrd	/live/initrd.xz
	}
}
