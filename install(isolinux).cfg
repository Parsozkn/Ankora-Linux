label installstart
	menu label ^Ankora OS Kurulumu Baslat
	linux /live/vmlinuz boot=live
	initrd /live/initrd.xz
	append vga=788  --- quiet

label installstartspeech
	menu label Ankora OS Kurulumu (^Sesli Sentez)
	linux /live/vmlinuz boot=live
	initrd /live/initrd.xz
	append speakup.synth=soft vga=788  --- quiet

menu begin install
	menu label ^Gelismis Ankora OS Kurulum Ayarlari
	menu title Gelismis Ankora OS Kurulum Ayarlari
	include stdmenu.cfg
	label mainmenu
		menu label ^Geri..
		menu exit

	menu begin graphicalinstall
		menu label ^Grafiksel Ankora Kurulumu
		menu title Grafiksel Ankora Kurulumu
		include stdmenu.cfg
		label mainmenu
			menu label ^Geri..
			menu exit

		label installgui
			menu label ^Kur
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append vga=788  --- quiet

		label expertgui
			menu label U^zman Kurulumu
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append priority=low vga=788 

		label autogui
			menu label ^Otomatik Kurulum
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append auto=true priority=critical vga=788  --- quiet

		label rescuegui
			menu label ^Kurtarma Modu (Rescue)
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append rescue/enable=true vga=788  --- quiet
	menu end

	menu begin textinstall
		menu label ^Metin Tabanli Kurulum
		menu title Metin Tabanli Kurulum
		include stdmenu.cfg
		label mainmenu
			menu label ^Geri..
			menu exit

		label install
			menu label ^Kur
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append vga=788  --- quiet

		label expert
			menu label U^zman Kurulumu
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append priority=low vga=788 

		label auto
			menu label ^Otomatik Kurulum
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append auto=true priority=critical vga=788  --- quiet

		label rescue
			menu label ^Kurtarma Modu (Rescue)
			linux /live/vmlinuz boot=live
			initrd /live/initrd.xz
			append rescue/enable=true vga=788  --- quiet
	menu end
menu end